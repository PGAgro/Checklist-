<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B3358">
<title>PGAgro — Chequeos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

  :root{
    --ink:#16223A;
    --green:#1B3358;
    --sage:#5C7FA6;
    --amber:#E4BE7A;
    --paper:#EDF1F6;
    --bg:#F6F8FA;
    --ok:#4C7156;
    --warn:#C98A2E;
    --bad:#B4442E;
    --line:#D7DEE6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Poppins', 'Helvetica Neue', Arial, sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:78px;
  }

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:20;
    background:var(--green);
    color:var(--paper);
    padding:calc(16px + env(safe-area-inset-top)) 18px 14px;
    display:flex; align-items:center; gap:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
  }
  header .icon{width:34px; height:34px; flex:0 0 auto;}
  header .brand{display:flex; flex-direction:column; line-height:1.05;}
  header .brand b{font-weight:800; font-size:19px;}
  header .brand span{font-weight:500; font-size:12px; color:var(--amber); letter-spacing:.4px;}
  header .today{margin-left:auto; text-align:right; font-size:11px; color:var(--paper); opacity:.85;}

  /* ---------- Views ---------- */
  main{flex:1; padding:16px 16px 8px;}
  .view{display:none; animation:fade .18s ease;}
  .view.active{display:block;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  h1.page-title{font-size:15px; font-weight:700; margin:4px 0 14px; color:var(--green); letter-spacing:.2px;}

  /* ---------- Cards ---------- */
  .card{
    background:var(--paper);
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
    border:1px solid var(--line);
  }
  .card-row{display:flex; align-items:center; gap:12px;}
  .card-row .dot{width:11px; height:11px; border-radius:50%; flex:0 0 auto;}
  .dot.ok{background:var(--ok);}
  .dot.warn{background:var(--warn);}
  .dot.bad{background:var(--bad);}
  .dot.grey{background:#A9B4C2;}
  .card-title{font-weight:700; font-size:15px; color:var(--ink);}
  .card-sub{font-size:12.5px; color:#4A5568; margin-top:2px;}
  .card-meta{font-size:11.5px; color:#7A8699; margin-top:6px;}
  .btn{
    appearance:none; border:none; cursor:pointer;
    border-radius:12px; font-family:inherit; font-weight:600; font-size:13.5px;
    padding:11px 16px; letter-spacing:.2px;
    transition:transform .05s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--green); color:var(--paper); width:100%;}
  .btn-outline{background:transparent; color:var(--green); border:1.5px solid var(--green); width:100%;}
  .btn-amber{background:var(--amber); color:var(--ink); width:100%;}
  .btn-small{padding:8px 12px; font-size:12.5px; border-radius:10px;}
  .btn-block{display:block; width:100%; margin-top:10px;}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  /* ---------- Equipment tiles (Chequeos tab) ---------- */
  .tile{
    background:var(--paper); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:12px; display:flex; align-items:center; gap:14px;
    cursor:pointer;
  }
  .tile .tile-ico{
    width:44px; height:44px; border-radius:12px; background:var(--green);
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
    color:var(--amber); font-size:20px;
  }
  .tile .tile-txt b{display:block; font-size:14.5px; color:var(--ink);}
  .tile .tile-txt span{font-size:12px; color:#5C7FA6;}
  .tile .chev{margin-left:auto; color:var(--sage); font-size:18px;}

  /* ---------- Forms ---------- */
  label.field-label{display:block; font-size:12px; font-weight:600; color:var(--green); margin:14px 0 5px;}
  input[type=text], input[type=date], input[type=number], select, textarea{
    width:100%; font-family:inherit; font-size:14px; color:var(--ink);
    background:#fff; border:1.5px solid var(--line); border-radius:10px;
    padding:10px 12px;
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--sage); outline-offset:1px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .hint{font-size:11px; color:#7A8699; margin-top:4px;}

  .point{
    border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px; background:#fff;
  }
  .point-name{font-weight:600; font-size:13.5px; margin-bottom:8px;}
  .seg{display:flex; gap:6px; margin-bottom:8px;}
  .seg button{
    flex:1; border:1.5px solid var(--line); background:#fff; border-radius:9px;
    padding:8px 0; font-family:inherit; font-weight:700; font-size:13px; color:#7A8699; cursor:pointer;
  }
  .seg button.on-ok{background:var(--ok); border-color:var(--ok); color:#fff;}
  .seg button.on-x{background:var(--bad); border-color:var(--bad); color:#fff;}
  .seg button.on-nc{background:#A9B4C2; border-color:#A9B4C2; color:#fff;}
  .point textarea{min-height:38px; resize:vertical; font-size:13px;}
  .point .plazo{margin-top:8px;}

  .section-divider{
    font-size:11px; font-weight:700; color:var(--sage); text-transform:uppercase;
    letter-spacing:.6px; margin:20px 0 10px; display:flex; align-items:center; gap:8px;
  }
  .section-divider::after{content:""; flex:1; height:1px; background:var(--line);}

  .back-link{
    display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600;
    color:var(--green); background:none; border:none; cursor:pointer; padding:0 0 12px; font-family:inherit;
  }

  /* ---------- Historial ---------- */
  .hist-item{
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:13px 15px; margin-bottom:10px; cursor:pointer;
  }
  .hist-item .hi-top{display:flex; justify-content:space-between; align-items:center;}
  .hist-item b{font-size:14px;}
  .hist-item .hi-date{font-size:11.5px; color:#7A8699;}
  .hist-item .hi-summary{font-size:12px; color:#4A5568; margin-top:4px;}
  .pill{
    display:inline-block; font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; margin-right:4px;
  }
  .pill.ok{background:rgba(76,113,86,.15); color:var(--ok);}
  .pill.bad{background:rgba(180,68,46,.15); color:var(--bad);}
  .pill.nc{background:rgba(139,138,124,.18); color:#5A6478;}

  .empty{
    text-align:center; padding:36px 20px; color:#7A8699; font-size:13px;
  }
  .empty b{display:block; color:var(--ink); font-size:14px; margin-bottom:4px;}

  /* ---------- Bottom nav ---------- */
  nav.tabbar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px; background:#fff; border-top:1px solid var(--line);
    display:flex; z-index:30;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.tabbar button{
    flex:1; background:none; border:none; font-family:inherit; cursor:pointer;
    padding:9px 2px 7px; display:flex; flex-direction:column; align-items:center; gap:2px;
    color:#A9B4C2; font-size:9.3px; font-weight:600;
  }
  nav.tabbar button .ic{font-size:17px; line-height:1;}
  nav.tabbar button.active{color:var(--green);}

  /* ---------- Checklists de salida / previo ---------- */
  .sal-prog{margin:0 0 14px;}
  .sal-prog .t{font-size:12.5px; font-weight:700; color:var(--green); margin-bottom:6px; display:flex; justify-content:space-between;}
  .sal-bar{height:8px; border-radius:6px; background:#E2E8F0; overflow:hidden;}
  .sal-bar i{display:block; height:100%; background:var(--ok); transition:width .25s;}
  .sal-leyenda{display:flex; gap:12px; flex-wrap:wrap; font-size:11.5px; color:#4A5568; margin:0 0 14px;}
  .sal-leyenda span::before{content:""; display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:-1px;}
  .sal-leyenda .r::before{background:var(--bad);} .sal-leyenda .a::before{background:var(--warn);} .sal-leyenda .v::before{background:var(--ok);}
  .sal-row{display:flex; gap:8px; align-items:stretch; margin-bottom:8px;}
  .sal-main{
    flex:1; min-width:0; display:flex; gap:12px; align-items:center; text-align:left; cursor:pointer;
    background:#fff; border:1.5px solid var(--line); border-left:6px solid var(--bad);
    border-radius:14px; padding:12px; min-height:58px; font-family:inherit; -webkit-tap-highlight-color:transparent;
  }
  .sal-main.s1{border-left-color:var(--warn); background:#FFF8EC;}
  .sal-main.s2{border-left-color:var(--ok); background:#EFF5F0;}
  .sal-chk{
    width:28px; height:28px; border-radius:50%; flex:0 0 auto; border:2.5px solid var(--bad);
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:16px; line-height:1;
  }
  .s1 .sal-chk{background:var(--warn); border-color:var(--warn);}
  .s2 .sal-chk{background:var(--ok); border-color:var(--ok);}
  .sal-txt{font-size:13.5px; font-weight:600; color:var(--ink); line-height:1.3;}
  .sal-meta{font-size:11px; color:#7A8699; margin-top:3px; font-weight:500;}
  .sal-hint{font-size:12px; color:#4A5568; margin-top:4px; font-weight:500;}
  .sal-proc{
    width:50px; flex:0 0 auto; border:1.5px solid var(--line); background:#fff; border-radius:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-family:inherit;
  }
  .sal-proc i{display:block; width:20px; height:20px; border-radius:50%; border:2.5px solid var(--warn); box-sizing:border-box;}
  .sal-proc.on{background:#FFF1D6; border-color:var(--warn);}
  .sal-proc.on i{background:var(--warn);}
  .sal-sec{font-size:11.5px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:#7A8699; margin:16px 0 8px;}

  .alert-card{
    background:#FBEAE6; border:1px solid #E7B7A8; border-radius:14px; padding:13px 15px; margin-bottom:12px;
  }
  .alert-card b{font-size:13.5px; color:var(--bad); display:block; margin-bottom:2px;}
  .alert-card span{font-size:12px; color:#7A4436;}

  .prod-row{display:grid; grid-template-columns:1.3fr .8fr 1fr auto; gap:6px; align-items:center; margin-bottom:8px;}
  .prod-row select, .prod-row input{font-size:12.5px; padding:8px 8px;}
  .rm-btn{
    background:none; border:none; color:var(--bad); font-size:18px; cursor:pointer; padding:0 4px;
  }
  .result-row{
    display:flex; justify-content:space-between; font-size:13px; padding:8px 0; border-bottom:1px dashed var(--line);
  }
  .result-row:last-child{border-bottom:none;}
  .order-list-num{
    counter-reset:carga;
  }
  .order-list-num li{
    counter-increment:carga;
    list-style:none; position:relative; padding-left:26px; margin-bottom:6px; font-size:13px;
  }
  .order-list-num li::before{
    content:counter(carga); position:absolute; left:0; top:-1px;
    background:var(--sage); color:#fff; width:19px; height:19px; border-radius:50%;
    font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .dt-result{
    border-radius:14px; padding:14px; margin-top:10px; font-size:13px;
  }
  .dt-result.ok{background:rgba(76,113,86,.13); color:var(--ok);}
  .dt-result.warn{background:rgba(201,138,46,.15); color:var(--warn);}
  .dt-result.bad{background:rgba(180,68,46,.13); color:var(--bad);}
  .dt-result b{display:block; font-size:14.5px; margin-bottom:3px;}
  .quick-actions{display:flex; gap:10px; margin-bottom:14px;}
  .op-log{display:flex; gap:8px; margin:10px 0;}
  .op-log button{flex:1;}
  .op-log .done{background:var(--sage); color:#fff; border:1.5px solid var(--sage);}
  .orden-mini{
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:8px; font-size:12.5px;
  }
  .orden-mini b{font-size:13.5px; display:block;}
  .orden-mini .om-meta{color:#7A8699; margin-top:2px;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(31,42,34,.45); z-index:50;
    display:none; align-items:flex-end; justify-content:center;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--bg); width:100%; max-width:480px; border-radius:20px 20px 0 0;
    padding:20px 18px 26px; max-height:88vh; overflow-y:auto;
  }
  .modal-handle{width:38px; height:4px; background:var(--line); border-radius:3px; margin:0 auto 14px;}

  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:30px;
    font-size:12.5px; font-weight:600; z-index:60; opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .toast.show{opacity:1;}
  /* ---------- Inicio (home) ---------- */
  .hero{
    background:linear-gradient(160deg,var(--green) 0%, #12264A 100%);
    color:var(--paper); border-radius:20px; padding:26px 20px 22px; text-align:center;
    margin-bottom:16px; position:relative; overflow:hidden;
  }
  .hero svg{width:104px; height:104px; display:block; margin:0 auto 8px;}
  .hero .h-name{font-weight:800; font-size:30px; letter-spacing:.3px; line-height:1;}
  .hero .h-name span{color:var(--amber); font-weight:500;}
  .hero .h-tag{margin-top:8px; font-size:11.5px; font-weight:600; letter-spacing:2.2px; text-transform:uppercase; color:var(--amber);}
  .hero .h-sub{margin-top:4px; font-size:12px; opacity:.8;}
  .stat-title{font-size:11px; font-weight:700; color:var(--sage); text-transform:uppercase; letter-spacing:.7px; margin:18px 2px 8px;}
  .stats{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .stat{
    background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:14px 14px 12px; cursor:pointer;
    text-align:left; font-family:inherit; color:var(--ink); display:flex; flex-direction:column; justify-content:flex-start; align-items:flex-start;
  }
  .stat.full{grid-column:1 / -1;}
  .stat .n{font-size:30px; font-weight:800; line-height:1; color:var(--green);}
  .stat .l{font-size:12.5px; font-weight:600; margin-top:6px;}
  .stat .s{font-size:11px; color:#7A8699; margin-top:2px;}
  .stat.warn .n{color:var(--warn);}
  .stat.bad .n{color:var(--bad);}
  .stat.ok .n{color:var(--ok);}
  .home-actions{display:grid; gap:10px; margin-top:18px;}

  /* ---------- Informes ---------- */
  .inf-item{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:13px 15px; margin-bottom:10px;}
  .inf-item .hi-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .inf-item b{font-size:14px;}
  .inf-actions{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .inf-actions .btn{width:auto; flex:1 1 auto; min-width:30%;}
  .btn-ghost{background:#fff; color:var(--green); border:1.5px solid var(--line);}
  .btn-danger{background:#fff; color:var(--bad); border:1.5px solid #E7B7A8;}
  .pill.warn{background:rgba(201,138,46,.17); color:var(--warn);}
  .sigbox{border:1.5px solid var(--line); border-radius:10px; background:#fff; touch-action:none; display:block; width:100%; height:110px;}
  .g-chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
  .g-chips button{border:1.5px solid var(--line); background:#fff; border-radius:20px; padding:6px 12px; font-family:inherit; font-weight:600; font-size:12px; color:#7A8699; cursor:pointer;}
  .g-chips button.on{background:var(--green); border-color:var(--green); color:var(--paper);}
  .g-chk{display:flex; gap:10px; align-items:flex-start; background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:6px; font-size:13px; cursor:pointer;}
  .g-chk input{margin-top:3px; width:18px; height:18px; flex:0 0 auto;}
  .g-chk small{color:#7A8699; font-size:11.5px;}
  .seg-filter{display:flex; gap:6px; margin-bottom:12px;}
  .seg-filter button{flex:1; border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:8px 0; font-family:inherit; font-weight:600; font-size:12px; color:#7A8699; cursor:pointer;}
  .seg-filter button.on{background:var(--green); border-color:var(--green); color:var(--paper);}
  input[type=time]{width:100%; font-family:inherit; font-size:14px; color:var(--ink); background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px;}
  .inf-item .hi-date{font-size:11.5px; color:#7A8699; white-space:nowrap;}

  details.extra{border:1.5px solid var(--line); border-radius:12px; background:#fff; padding:0 12px; margin-top:14px;}
  details.extra summary{cursor:pointer; font-weight:600; font-size:13px; color:var(--green); padding:12px 0; list-style:none;}
  details.extra summary::before{content:"＋ "; color:var(--sage);} details.extra[open] summary::before{content:"－ ";}
  details.extra[open]{padding-bottom:12px;}
  .lote-row{display:grid; grid-template-columns:1.2fr 1fr auto; gap:6px; align-items:center; margin-bottom:6px;}
  .fgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .fth{position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; border:1px solid var(--line); background:#fff;}
  .fth img{width:100%; height:100%; object-fit:cover; display:block;}
  .fth button{position:absolute; top:4px; right:4px; width:24px; height:24px; border-radius:50%; border:none; background:rgba(22,34,58,.75); color:#fff; font-size:13px; cursor:pointer; line-height:1;}
  .fadd{aspect-ratio:1; border:2px dashed var(--sage); border-radius:10px; background:#fff; color:var(--sage); font-family:inherit; font-weight:600; font-size:12px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;}
  .fadd b{font-size:22px; line-height:1;}
  .fstrip{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
  .fstrip img{width:54px; height:54px; object-fit:cover; border-radius:8px; border:1px solid var(--line); cursor:pointer;}
  #lightbox{position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:200; display:none; align-items:center; justify-content:center;}
  #lightbox.show{display:flex;}
  #lightbox img{max-width:96vw; max-height:88vh; border-radius:6px;}
  #lightbox button{position:absolute; top:calc(14px + env(safe-area-inset-top)); right:16px; border:none; background:rgba(255,255,255,.18); color:#fff; font-size:22px; width:42px; height:42px; border-radius:50%; cursor:pointer;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
</head>
<body>
<div id="app">

  <div id="loginScreen" style="position:fixed; inset:0; z-index:100; background:var(--green); display:flex; align-items:center; justify-content:center; padding:24px;">
    <div style="max-width:340px; width:100%;">
      <svg viewBox="0 0 120 120" width="60" height="60" style="display:block; margin:0 auto 10px;">
        <path d="M86.39 22.32 A46 46 0 1 1 33.61 22.32" fill="none" stroke="#E4BE7A" stroke-width="6" stroke-linecap="round"/>
        <circle cx="60" cy="88" r="5" fill="#EDF1F6"/>
        <path d="M60 83.5 C60 66 60 46 60 27" fill="none" stroke="#EDF1F6" stroke-width="5.5" stroke-linecap="round"/>
        <path d="M60 27 C50 20 40 14 33 6 C46 4 57 10 60 27 Z" fill="#EDF1F6"/>
        <path d="M60 27 C70 18 78 12 86 5 C74 2 62 9 60 27 Z" fill="#EDF1F6" opacity="0.65"/>
      </svg>
      <div style="text-align:center; color:var(--paper); font-weight:800; font-size:20px; margin-bottom:2px;">PG<span style="color:var(--amber); font-weight:500;">Agro</span></div>
      <div style="text-align:center; color:var(--amber); font-size:12px; margin-bottom:22px;">Chequeos de equipos</div>

      <div style="background:var(--paper); border-radius:16px; padding:18px;">
        <div style="display:flex; gap:6px; margin-bottom:14px;">
          <button type="button" id="tabLogin" class="btn btn-small" style="flex:1; background:var(--green); color:var(--paper);" onclick="mostrarTab('login')">Iniciar sesión</button>
          <button type="button" id="tabRegistro" class="btn btn-small" style="flex:1; background:transparent; color:var(--green); border:1.5px solid var(--green);" onclick="mostrarTab('registro')">Crear cuenta</button>
        </div>

        <div id="bloqueLogin">
          <label class="field-label" style="margin-top:0;">Email</label>
          <input type="text" id="li_email" placeholder="tu@email.com">
          <label class="field-label">Contraseña</label>
          <input type="password" id="li_pass" placeholder="••••••••">
          <button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="hacerLogin()">Entrar</button>
        </div>

/* Con poca señal, la promesa de escritura de Firestore no se resuelve hasta que el

function confirmarEscritura(p){
  return Promise.race([
    p.then(()=>true),
    new Promise(res=>setTimeout(()=>res(false), 3000))

}

  return mapa[codigo] || "No se pudo completar la operación. Revisá los datos e intentá de nuevo.";
}

function hacerRegistro(){
  const nombre = document.getElementById("re_nombre").value.trim();
  const email = document.getElementById("re_email").value.trim();
  const pass = document.getElementById("re_pass").value;
  document.getElementById("loginError").textContent = "";
  if(!nombre){ document.getElementById("loginError").textContent = "Ingresá tu nombre y apellido."; return; }
  createUserWithEmailAndPassword(auth, email, pass)
    .then(cred => updateProfile(cred.user, { displayName: nombre }).then(()=>sendEmailVerification(cred.user)).then(()=>location.reload()))
    .catch(err=>{ document.getElementById("loginError").textContent = traducirErrorAuth(err.code); });
}

let escuchasIniciadas = false;
function iniciarEscuchas(){
  if(escuchasIniciadas) return;
  escuchasIniciadas = true;
  // Ordenamos en el cliente: si a algún documento le faltara "fecha", una consulta
  // con orderBy lo excluiría en silencio.
  const ordenar = (snap)=> snap.docs.map(d=>({ id:d.id, ...d.data() }))
      .sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));

  onSnapshot(collection(db,"informes"), (snap)=>{
    STORE.informes = ordenar(snap); refrescarVistaActual();
  }, err=>console.error("informes:", err));
}

function fmtDate(d){
  if(!d) return "—";
  const dt = new Date(d+"T00:00:00");
  return dt.toLocaleDateString("es-UY",{day:"2-digit",month:"2-digit",year:"numeric"});
}
function todayStr(){
  const d = new Date();
  const m = String(d.getMonth()+1).padStart(2,"0"), dd = String(d.getDate()).padStart(2,"0");
  return d.getFullYear()+"-"+m+"-"+dd;
}
function addDays(dateStr, days){
  const d = new Date(dateStr+"T00:00:00");
  d.setDate(d.getDate()+days);
  const m = String(d.getMonth()+1).padStart(2,"0"), dd = String(d.getDate()).padStart(2,"0");
  return d.getFullYear()+"-"+m+"-"+dd;
}
function daysBetween(a,b){
  return Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00")) / 86400000);
}

const SAL = { vista:"op", fecha:null, data:{ op:{}, post:{}, adm:{} }, cfg:{}, unsub:[] };

function limpiarSalidas(){
  SAL.unsub.forEach(u=>{ try{ u(); }catch(e){} });
  SAL.unsub = []; SAL.fecha = null; SAL.data = { op:{}, post:{}, adm:{} }; SAL.cfg = {}; SAL.vista = "op";
}
function salidaActiva(){
  const v = document.getElementById("view-salida");
  return !!(v && v.classList.contains("active"));
}
function suscribirSalidas(){
  const hoy = todayStr();
  if(SAL.fecha === hoy) return;
  SAL.unsub.forEach(u=>{ try{ u(); }catch(e){} });
  SAL.unsub = []; SAL.fecha = hoy; SAL.data = { op:{}, post:{}, adm:{} };
  const alerta = n => err=>console.error(n+":", err);
  SAL.unsub.push(onSnapshot(doc(db,"salidas",hoy), s=>{
    SAL.data.op = (s.exists() && s.data().items) || {};
    if(salidaActiva()) renderSalida();
  }, alerta("salidas")));
  SAL.unsub.push(onSnapshot(doc(db,"salidas","post-"+hoy), s=>{
    SAL.data.post = (s.exists() && s.data().items) || {};
    if(salidaActiva()) renderSalida();
  }, alerta("salidas/post")));
  SAL.unsub.push(onSnapshot(doc(db,"salidas","config"), s=>{
    SAL.cfg = s.exists() ? s.data() : {};
    if(salidaActiva()) renderSalida();
  }, alerta("salidas/config")));
  if(ES_ADMIN){
    SAL.unsub.push(onSnapshot(doc(db,"salidas_adm",hoy), s=>{
      SAL.data.adm = (s.exists() && s.data().items) || {};
      if(salidaActiva()) renderSalida();
    }, alerta("salidas_adm")));
  }
}

function docSalida(lista){ return lista==="post" ? "post-"+SAL.fecha : SAL.fecha; }
function setListaSalida(l){
  if(l==="adm" && !ES_ADMIN) return;
  SAL.vista = l; renderSalida();
}

function renderSalida(){
  if(!document.getElementById("salidaBody")) return;
  suscribirSalidas();
  if(!ES_ADMIN && SAL.vista==="adm") SAL.vista = "op";
  const sw = document.getElementById("salidaSwitch");
  sw.querySelector('[data-l="adm"]').style.display = ES_ADMIN ? "" : "none";
  sw.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.l===SAL.vista));
  const lista = SAL.vista, L = LISTAS[lista], d = SAL.data[lista] || {};
  document.getElementById("salidaTitulo").textContent = L.titulo;

  let total = 0, ok = 0, proc = 0;
  L.secciones.forEach(s=>s.items.forEach(it=>{ total++; const e=(d[it[0]]||{}).e||0; if(e===2) ok++; if(e===1) proc++; }));
  const pct = total ? Math.round(ok*100/total) : 0;

  let h = `<div class="sal-prog"><div class="t"><span>${ok} de ${total} listos${proc?` · ${proc} en proceso`:""}</span><span>${pct}%</span></div>
    <div class="sal-bar"><i style="width:${pct}%"></i></div></div>
    <div class="sal-leyenda"><span class="r">Pendiente</span><span class="a">En proceso</span><span class="v">Listo</span></div>`;
  L.secciones.forEach(s=>{
    h += `<div class="sal-sec">${esc(s.t)}</div>`;
    s.items.forEach(([k,txt,extra])=>{
      const it = d[k] || {}, e = it.e||0;
      const estado = e===2 ? "Listo" : e===1 ? "En proceso" : "Pendiente";
      const meta = e ? `<div class="sal-meta">${estado}${it.p?" · "+esc(it.p):""}${it.h?" · "+esc(it.h):""}</div>` : "";
      const hint = "";
      h += `<div class="sal-row">
        <button type="button" class="sal-main s${e}" aria-label="${esc(txt)} — ${estado}" onclick="tocarItem('${lista}','${k}')">
          <span class="sal-chk">${e===2?"✓":""}</span>
          <span><div class="sal-txt">${esc(txt)}</div>${hint}${meta}</span>
        </button>
        <button type="button" class="sal-proc${e===1?" on":""}" aria-label="Marcar en proceso: ${esc(txt)}" onclick="procesoItem('${lista}','${k}')"><i></i></button>
      </div>`;
    });
  });
  h += `<button class="btn btn-outline" style="margin-top:14px;" onclick="reiniciarLista('${lista}')">↺ Reiniciar lista (todo a pendiente)</button>`;
  document.getElementById("salidaBody").innerHTML = h;
}

async function guardarItem(lista, k, val){
  if(lista==="adm" && !ES_ADMIN) return;
  suscribirSalidas();
  SAL.data[lista][k] = val; renderSalida();
  const ref = doc(db, LISTAS[lista].col, docSalida(lista));
  try{
    const ok = await confirmarEscritura(setDoc(ref, { fecha:SAL.fecha, items:{ [k]: val } }, { merge:true }));
    if(!ok) showToast("Sin señal: se guarda al reconectar");
  }catch(e){ console.error(e); showToast("No se pudo guardar — revisá la conexión"); }
}
function horaAhora(){
  const d = new Date();
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function cambiarEstado(lista, k, nuevo){
  const val = nuevo===0 ? { e:0 } : { e:nuevo, p:currentOperadorNombre(), h:horaAhora() };
  guardarItem(lista, k, val);
}
// Un toque: pendiente/en proceso → listo; listo → pendiente
function tocarItem(lista, k){
  const e = ((SAL.data[lista]||{})[k]||{}).e||0;
  cambiarEstado(lista, k, e===2 ? 0 : 2);
}
// Botón amarillo: en proceso (otro toque lo devuelve a pendiente)
function procesoItem(lista, k){
  const e = ((SAL.data[lista]||{})[k]||{}).e||0;
  cambiarEstado(lista, k, e===1 ? 0 : 1);
}
async function reiniciarLista(lista){
  if(lista==="adm" && !ES_ADMIN) return;
  if(!confirm("¿Dejar toda la lista en pendiente?")) return;
  suscribirSalidas();
  SAL.data[lista] = {}; renderSalida();
  const ref = doc(db, LISTAS[lista].col, docSalida(lista));
  try{ await confirmarEscritura(setDoc(ref, { fecha:SAL.fecha, items:{} })); }
  catch(e){ console.error(e); showToast("No se pudo reiniciar — revisá la conexión"); }
}

function lastChecklistFor(tipo){
  const items = STORE.checklists.filter(c=>c.tipo===tipo).sort((a,b)=> b.fecha.localeCompare(a.fecha));
  return items[0] || null;
}

function statusFor(tipo){
  const last = lastChecklistFor(tipo);
  if(!last) return {dot:"grey", label:"Sin registrar", next:null};
  const hoy = todayStr();
  const diff = daysBetween(hoy, last.proximoChequeo);
  if(diff < 0) return {dot:"bad", label:"Vencido", next:last.proximoChequeo, last};
  if(diff <= 3) return {dot:"warn", label:"Próximo a vencer", next:last.proximoChequeo, last};
  return {dot:"ok", label:"Al día", next:last.proximoChequeo, last};
}

/* ---------- fotos (hasta 6, comprimidas, guardadas dentro del documento) ---------- */
const MAX_FOTOS = 6, MAX_CHARS = 900000;   // el documento de Firestore admite ~1 MB en total
let fotosForm = [];
const totalChars = () => fotosForm.reduce((n,f)=>n+f.length,0);

function renderFotosGrid(){
  const el = document.getElementById("fotosGrid");
  if(!el) return;
  el.innerHTML = fotosForm.map((f,i)=>`<div class="fth"><img src="${f}" onclick="verFotoForm(${i})" alt=""><button type="button" onclick="quitarFoto(${i})">✕</button></div>`).join("")
    + (fotosForm.length<MAX_FOTOS ? `<button type="button" class="fadd" onclick="document.getElementById('fotoInput').click()"><b>＋</b>Foto ${fotosForm.length}/${MAX_FOTOS}</button>` : "");
}
function comprimirFoto(file, lado, calidad){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = ()=>{
      const k = Math.min(1, lado/Math.max(img.width,img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", calidad));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error("imagen no válida")); };
    img.src = url;
  });
}
async function agregarFotos(input){
  const files = [...input.files]; input.value = "";
  for(const f of files){
    if(fotosForm.length>=MAX_FOTOS){ showToast("Máximo "+MAX_FOTOS+" fotos"); break; }
    try{
      let d = await comprimirFoto(f, 1000, 0.72);
      if(d.length>200000) d = await comprimirFoto(f, 800, 0.6);
      if(totalChars()+d.length>MAX_CHARS){ showToast("No entran más fotos en este reporte"); break; }
      fotosForm.push(d); renderFotosGrid();
    }catch(e){ showToast("No se pudo cargar una de las imágenes"); }
  }
}
function quitarFoto(i){ fotosForm.splice(i,1); renderFotosGrid(); }
function fotosBloque(){
  return `<label class="field-label">Fotos (hasta ${MAX_FOTOS})</label>
    <div class="fgrid" id="fotosGrid"></div>
    <input type="file" id="fotoInput" accept="image/*" multiple style="display:none" onchange="agregarFotos(this)">`;
}

  const meses = [...new Set([todayStr().slice(0,7), ...STORE.informes.map(i=>(i.fecha||"").slice(0,7)).filter(Boolean)])].sort().reverse();
  const nomMes = m => { const t = new Date(m+"-01T00:00:00").toLocaleDateString("es-UY",{month:"long",year:"numeric"}); return t.charAt(0).toUpperCase()+t.slice(1); };
  if(MES_INF!=="todos" && !meses.includes(MES_INF)) MES_INF = meses[0];
  const selMes = document.getElementById("infMes");
  selMes.innerHTML = `<option value="todos">Todos los meses</option>` + meses.map(m=>`<option value="${m}" ${m===MES_INF?"selected":""}>${nomMes(m)}</option>`).join("");
  selMes.value = MES_INF;
  let items = [...STORE.informes];
  if(MES_INF!=="todos") items = items.filter(i=>(i.fecha||"").startsWith(MES_INF));
  const totHa = items.reduce((n,i)=>n+pn(i.supAplicada),0);
  document.getElementById("infResumen").textContent = items.length + " informe" + (items.length===1?"":"s") + (MES_INF!=="todos"?" en "+nomMes(MES_INF).toLowerCase():"") + (totHa>0 ? " · " + fmtNum(Math.round(totHa*100)/100) + " ha aplicadas" : "");
  if(FILTRO_INF==="pend") items = items.filter(i=>!i.enviado);
  if(FILTRO_INF==="env") items = items.filter(i=>i.enviado);
  if(items.length===0){
    el.innerHTML = `<div class="empty"><b>${FILTRO_INF==="env"?"Todavía no marcaste informes como enviados.":FILTRO_INF==="pend"?"No hay informes pendientes de enviar.":"Todavía no hay informes."}</b>Al terminar un trabajo, cargá el informe con el botón “Nuevo informe”.</div>`;
    return;
  }
  el.innerHTML = items.map(i=>`
    <div class="inf-item">
      <div class="hi-top">
        <div>
          <b>${esc(i.cliente || i.campo || "Sin cliente")}</b>
          <div class="card-sub">${esc([i.cliente?i.campo:"", i.localidad].filter(Boolean).join(" · "))}</div>
        </div>
        <span class="hi-date">${fmtDate(i.fecha)}</span>
      </div>
      <div class="hi-summary">
        ${i.enviado
          ? `<span class="pill ok">✓ Enviado ${i.enviadoFecha?fmtDate(i.enviadoFecha):""}</span>`
          : `<span class="pill warn">${i.borrador ? "Falta completar" : "Pendiente de enviar"}</span>`}
        ${i.supAplicada ? `<span class="pill nc">${esc(fmtNum(i.supAplicada))} ha</span>` : ""}
        ${i.cultivo ? `<span class="pill nc">${esc(i.cultivo)}</span>` : ""}
        ${i.objetivo ? `<span class="pill nc">${esc(i.objetivo)}</span>` : ""}
      </div>
      ${tiraFotos("informes", i)}
      <div class="inf-actions">
        <button class="btn btn-primary btn-small" onclick="pdfInforme('${i.id}')">📄 PDF</button>
        <button class="btn btn-ghost btn-small" onclick="openInforme('${i.id}')">✏️ Editar</button>
        <button class="btn btn-ghost btn-small" onclick="marcarEnviado('${i.id}', ${i.enviado?"false":"true"})">${i.enviado?"↩ Desmarcar":"✓ Marcar enviado"}</button>
        <button class="btn btn-danger btn-small" onclick="eliminarInforme('${i.id}')">🗑</button>

function addLote(lote="", has=""){
  const box = document.getElementById("lotesBox"); if(!box) return;
  const d = document.createElement("div"); d.className = "lote-row";
  d.innerHTML = `<input type="text" class="l-lote" placeholder="Lote" value="${esc(lote)}"><input type="text" inputmode="decimal" class="l-has" placeholder="Has" value="${esc(has)}" oninput="sumarLotes()"><button type="button" class="rm-btn" onclick="rmLote(this)">✕</button>`;
  box.appendChild(d); sumarLotes();
}
function rmLote(btn){ btn.parentElement.remove(); sumarLotes(); }
function sumarLotes(){
  const t = [...document.querySelectorAll("#lotesBox .l-has")].reduce((n,e)=>n+pn(e.value),0);
  const el = document.getElementById("lotesTotal");
  if(el) el.textContent = t>0 ? "Total de lotes: "+fmtNum(Math.round(t*100)/100)+" ha" : "";

function leerLotes(){
  return [...document.querySelectorAll("#lotesBox .lote-row")].map(r=>({ lote:r.querySelector(".l-lote").value.trim(), has:normNum(r.querySelector(".l-has").value.trim()) }))
    .filter(l=>l.lote||l.has);

async function guardarInforme(){
  const g = id => document.getElementById(id).value.trim();
  const campo = g("i_campo"), cliente = g("i_cliente");
  if(!cliente && !campo){ showToast("Indicá al menos el cliente o el campo"); return; }
  const datos = {
    fecha: g("i_fecha") || todayStr(), cliente, localidad: g("i_localidad"), campo,
    encargado: g("i_encargado"), equipo: g("i_equipo"),
    cultivo: g("i_cultivo"), objetivo: g("i_objetivo"),
    supAplicada: normNum(g("i_supaplic")),
    horaInicio: g("i_hini"), horaFin: g("i_hfin"), comentario: g("i_comentario"), fotos: fotosForm,
    cFirma: g("x_firma"), establec: g("x_estab"), etapa: g("x_etapa"), orden: g("x_orden"), dosis: g("x_dosis"), operadorAp: g("x_operador"), lotes: leerLotes(), borrador: false,
    updatedAt: serverTimestamp()
  };
  const id = informeEditandoId;
  closeForm();
  try{
    if(id){
      await confirmarEscritura(updateDoc(doc(db,"informes",id), datos));
    }else{
      const ref = nuevoId("informes");
      await confirmarEscritura(setDoc(ref, { ...datos, enviado:false, enviadoFecha:null, operador:currentOperadorNombre(), createdAt:serverTimestamp() }));
    }
    showToast(id ? "Planilla actualizada" : "Planilla guardada");
    showView("informes");
  }catch(err){ console.error(err); showToast("No se pudo guardar — revisá la conexión"); }
}

async function pdfInforme(id){
  const i = STORE.informes.find(x=>x.id===id);
  if(!i) return;
  if(!window.html2pdf){ showToast("No se pudo cargar el generador de PDF — necesita conexión la primera vez"); return; }
  showToast("Generando PDF…");
  const wrap = document.createElement("div");
  wrap.style.cssText = "position:absolute; left:0; top:0; width:794px; background:#fff; z-index:-1; pointer-events:none;";
  window.scrollTo(0,0);
  wrap.innerHTML = htmlInforme(i);
  document.body.appendChild(wrap);
  const limpio = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-zA-Z0-9]+/g,"_").replace(/^_|_$/g,"");
  const nombre = `Informe_${limpio(i.cliente||i.campo)||"aplicacion"}_${i.fecha||todayStr()}.pdf`;
  try{
    const blob = await window.html2pdf().set({
      margin:0, filename:nombre, image:{type:"jpeg", quality:0.95},
      html2canvas:{scale:2, useCORS:true, backgroundColor:"#ffffff", windowWidth:794, scrollX:0, scrollY:0, x:0, y:0},
      jsPDF:{unit:"mm", format:"a4", orientation:"portrait"},
      pagebreak:{mode:["css","legacy"], avoid:[".fotobox"]}
    }).from(wrap.firstElementChild).outputPdf("blob");
    const file = new File([blob], nombre, {type:"application/pdf"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:"Planilla de aplicación — PGAgro"}); showToast("Listo — cuando lo envíes, marcalo como enviado"); }
      catch(e){ if(e && e.name!=="AbortError") descargarBlob(blob, nombre); }
    }else{
      descargarBlob(blob, nombre);
      showToast("PDF descargado");
    }
  }catch(err){
    console.error(err); showToast("No se pudo generar el PDF");
  }finally{
    wrap.remove();
  }
}
function descargarBlob(blob, nombre){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

        ${p.plazo && p.plazo!=="Sin corrección" ? `<div class="hint">Plazo de corrección: ${p.plazo}</div>` : ""}
      </div>
    `).join("")}
  `;
  document.getElementById("detailOverlay").classList.add("show");
}

async function guardarOperador(){
  const email = document.getElementById("op_email").value.trim().toLowerCase();
  const nombre = document.getElementById("op_nombre").value.trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ showToast("Revisá el email"); return; }
  try{
    await confirmarEscritura(setDoc(doc(db,"operadores",email), { email, nombre, creadoPor:currentOperadorNombre(), createdAt:serverTimestamp() }));
    document.getElementById("op_email").value = ""; document.getElementById("op_nombre").value = "";
    showToast("Operador habilitado");

}
async function quitarOperador(id){
  if(!confirm("¿Quitar el acceso a "+id+"?")) return;
  try{ await confirmarEscritura(deleteDoc(doc(db,"operadores",id))); showToast("Acceso quitado"); }
  catch(err){ console.error(err); showToast("No se pudo quitar"); }
}


/* =========================================================
   GESTIÓN · solo administradores
   Clientes → campos → trabajos → facturas (que agrupan trabajos).
   Colecciones gs_* (las reglas de Firestore solo dejan leerlas al admin).
   Los operadores NO ven nada de esto: tarifas, importes y cobros
   viven únicamente acá. Los informes (colección "informes") no
   llevan ningún dato económico.
   ========================================================= */
const GCOL = { clientes:"gs_clientes", campos:"gs_campos", trabajos:"gs_trabajos", facturas:"gs_facturas", insumos:"gs_insumos", ventas:"gs_ventas" };
const G = { clientes:[], campos:[], trabajos:[], facturas:[], insumos:[], ventas:[], vista:"resumen", filtroT:"todos", filtroF:"pend", filtroV:"todas", cliId:null };
let gEscuchando = false;

function gIniciar(){
  if(!ES_ADMIN || gEscuchando) return;
  gEscuchando = true;
  Object.keys(GCOL).forEach(k=>{
    onSnapshot(collection(db,GCOL[k]), snap=>{
      G[k] = snap.docs.map(d=>({ id:d.id, ...d.data() }));
      refrescarVistaActual();
    }, err=>console.error(GCOL[k], err));
  });
}

/* ---------- helpers ---------- */
const gv = (o,k) => esc(o && o[k]!=null ? o[k] : "");
const gg = id => { const e = document.getElementById(id); return e ? String(e.value||"").trim() : ""; };
function gOpts(list, sel){
  return list.map(o=>{ const [v,l] = Array.isArray(o) ? o : [o,o];
    return `<option value="${esc(v)}" ${String(v)===String(sel)?"selected":""}>${esc(l)}</option>`; }).join("");
}
function gForm(html){
  const m = document.getElementById("formModal");
  m.innerHTML = `<div class="modal-handle"></div><button class="back-link" onclick="closeForm()">‹ Volver</button>` + html;
  document.getElementById("formOverlay").classList.add("show");
  m.scrollTop = 0;
}
async function gEscribir(p, ok){
  try{ await confirmarEscritura(p); if(ok) showToast(ok); return true; }
  catch(e){ console.error(e); showToast("No se pudo guardar — revisá la conexión"); return false; }
}
const money = (n, mon) => (mon==="UYU" ? "$U " : "US$ ") + Number(n||0).toLocaleString("es-UY",{maximumFractionDigits:2});
function sumMon(items, fn){
  const s = { USD:0, UYU:0 };
  items.forEach(x=>{ const [m,v] = fn(x); s[m==="UYU"?"UYU":"USD"] += v; });
  return s;
}
const monTxt = s => [s.USD?money(s.USD,"USD"):"", s.UYU?money(s.UYU,"UYU"):""].filter(Boolean).join(" · ") || "—";

const gCli = id => G.clientes.find(c=>c.id===id);
const gCampo = id => G.campos.find(c=>c.id===id);
const gNomCli = id => (gCli(id)||{}).nombre || "(cliente eliminado)";
const gNomCampo = t => (gCampo(t.campoId)||{}).nombre || t.campoTxt || "";
const gSorted = (arr, f) => [...arr].sort((a,b)=>(b[f]||"").localeCompare(a[f]||""));

function importeTrabajo(t){
  const m = pn(t.importe);
  return m>0 ? m : pn(t.ha)*pn(t.tarifa);
}
const facturaDe = t => G.facturas.find(f=>(f.trabajoIds||[]).includes(t.id));
const factTrabajos = f => (f.trabajoIds||[]).map(id=>G.trabajos.find(t=>t.id===id)).filter(Boolean);
const importeVenta = v => pn(v.cantidad)*pn(v.precio);
const gananciaVenta = v => pn(v.cantidad)*pn(v.ganancia);
const facturaDeV = v => G.facturas.find(f=>(f.ventaIds||[]).includes(v.id));
const factVentas = f => (f.ventaIds||[]).map(id=>G.ventas.find(v=>v.id===id)).filter(Boolean);
function factTotal(f){
  return pn(f.totalManual)>0 ? pn(f.totalManual) : factTrabajos(f).reduce((n,t)=>n+importeTrabajo(t),0) + factVentas(f).reduce((n,v)=>n+importeVenta(v),0);
}
function estadoCobroV(v){
  const f = facturaDeV(v);
  if(!f) return { k:"sin", l:"Por facturar", cls:"warn" };
  if(f.estado==="cobrada") return { k:"cob", l:"Cobrado", cls:"ok" };
  const venc = f.vence && f.vence < todayStr();
  return { k:"pend", l: venc ? "Pago vencido" : "Facturado · pago pendiente", cls: venc ? "bad" : "nc" };
}
const informeDe = t => t.informeId ? STORE.informes.find(i=>i.id===t.informeId) : null;

/* estado del informe de un trabajo (solo si ya está realizado) */
function estadoInforme(t){
  if(t.estado!=="Realizado") return null;
  const i = informeDe(t);
  if(!i)          return { k:"sin",  l:"Sin informe",           cls:"warn" };
  if(i.enviado)   return { k:"env",  l:"Informe enviado",       cls:"ok" };
  if(i.borrador)  return { k:"borr", l:"Informe por completar", cls:"warn" };
  return              { k:"pend", l:"Informe por enviar",    cls:"warn" };
}
/* estado de cobro, independiente del informe */
function estadoCobro(t){
  if(t.estado!=="Realizado") return null;
  const f = facturaDe(t);
  if(!f) return { k:"sin", l:"Por facturar", cls:"warn" };
  if(f.estado==="cobrada") return { k:"cob", l:"Cobrado", cls:"ok" };
  const venc = f.vence && f.vence < todayStr();
  return { k:"pend", l: venc ? "Pago vencido" : "Facturado · pago pendiente", cls: venc ? "bad" : "nc" };
}

/* ---------- navegación interna ---------- */
function gVista(v){ G.vista = v; renderGestion(); window.scrollTo({top:0}); }
function gIr(v, filtro){
  G.vista = v;
  if(v==="trabajos" && filtro) G.filtroT = filtro;
  if(v==="facturas" && filtro) G.filtroF = filtro;
  showView("gestion");
}
function gSetFiltroT(f){ G.filtroT = f; renderGestion(); }
function gSetFiltroF(f){ G.filtroF = f; renderGestion(); }
function gAbrirCliente(id){ G.cliId = id; G.vista = "cliente"; renderGestion(); window.scrollTo({top:0}); }

function renderGestion(){
  if(!ES_ADMIN) return;
  document.querySelectorAll("#gSub button").forEach(b=>b.classList.toggle("on",
    b.dataset.v===G.vista || (G.vista==="cliente" && b.dataset.v==="clientes")));
  const el = document.getElementById("gBody");
  if(G.vista==="clientes") el.innerHTML = gClientesHTML();
  else if(G.vista==="cliente") el.innerHTML = gDetalleHTML();
  else if(G.vista==="trabajos") el.innerHTML = gTrabajosHTML();
  else if(G.vista==="insumos") el.innerHTML = gInsumosHTML();
  else if(G.vista==="facturas") el.innerHTML = gFacturasHTML();
  else el.innerHTML = gResumenHTML();
}

/* ---------- RESUMEN ---------- */
function gContadores(){
  const hoy = todayStr(), mes = hoy.slice(0,7);
  const realizados = G.trabajos.filter(t=>t.estado==="Realizado");
  const porFacturar = realizados.filter(t=>!facturaDe(t));
  const pend = G.facturas.filter(f=>f.estado!=="cobrada");
  const venc = pend.filter(f=>f.vence && f.vence<hoy);
  const cobMes = G.facturas.filter(f=>f.estado==="cobrada" && (f.cobradaFecha||"").startsWith(mes));
  const infPend = realizados.filter(t=>{ const e=estadoInforme(t); return e && e.k!=="env"; });
  const porHacer = G.trabajos.filter(t=>t.estado!=="Realizado");
  const sinHa = realizados.filter(t=>!(pn(t.ha)>0));
  const ventasPorFacturar = G.ventas.filter(v=>!facturaDeV(v));
  return { ventasPorFacturar, porFacturar, pend, venc, cobMes, infPend, porHacer, sinHa };
}
function gStatsHTML(){
  const c = gContadores();
  const st = (cls,n,l,s,v,f)=>`<button class="stat ${cls}" onclick="gIr('${v}','${f}')"><div class="n">${n}</div><div class="l">${l}</div><div class="s">${s}</div></button>`;
  return `<div class="stats">
    ${st((c.porFacturar.length+c.ventasPorFacturar.length)?"warn":"ok", c.porFacturar.length+c.ventasPorFacturar.length, "Por facturar", esc(monTxt(sumMon([...c.porFacturar.map(t=>[t.moneda,importeTrabajo(t)]),...c.ventasPorFacturar.map(v=>[v.moneda,importeVenta(v)])],x=>x))), "trabajos","sinfact")}
    ${st(c.venc.length?"bad":(c.pend.length?"warn":"ok"), c.pend.length, "Pago pendiente", esc(monTxt(sumMon(c.pend,f=>[f.moneda,factTotal(f)])))+(c.venc.length?" · "+c.venc.length+" vencida"+(c.venc.length>1?"s":""):""), "facturas","pend")}
    ${st(c.infPend.length?"warn":"ok", c.infPend.length, "Informes por enviar", "al productor", "trabajos","inf")}
    ${st("", c.porHacer.length, "Trabajos por hacer", "surgieron, sin realizar", "trabajos","pend")}
  </div>`;
}
function gResumenHTML(){
  const c = gContadores();
  return `
    ${gStatsHTML()}
    <div class="stat-title">Cobrado este mes</div>
    <div class="stats"><button class="stat full ok" onclick="gIr('facturas','cob')"><div class="n" style="font-size:22px;">${esc(monTxt(sumMon(c.cobMes,f=>[f.moneda,factTotal(f)])))}</div><div class="l">${c.cobMes.length} factura${c.cobMes.length===1?"":"s"} cobrada${c.cobMes.length===1?"":"s"}</div></button></div>
    ${c.sinHa.length ? `<div class="alert-card" style="margin-top:12px;"><b>${c.sinHa.length} trabajo${c.sinHa.length>1?"s":""} realizado${c.sinHa.length>1?"s":""} sin hectáreas</b><span>Cargalas para poder facturar y para completar el informe.</span></div>` : ""}
    ${!G.clientes.some(c=>c.nombre==="Dos Ceibos") ? `<div class="alert-card" style="margin-top:12px;"><b>Cargar datos de la planilla</b><span>Trae Dos Ceibos (7 trabajos realizados y su factura pendiente).</span><button class="btn btn-outline btn-small" style="margin-top:8px;" onclick="gImportarInicial()">⬇️ Cargar ahora</button></div>` : ""}
    ${(c.ventasPorFacturar.length)?`<div class="hint" style="margin-top:10px;">Incluye ${c.ventasPorFacturar.length} venta${c.ventasPorFacturar.length>1?"s":""} de insumos sin facturar.</div>`:""}
    ${!G.insumos.length && !G.ventas.length ? `<div class="alert-card" style="margin-top:12px;"><b>Cargar ventas de insumos</b><span>Trae los productos, el stock y las 4 ventas de la planilla (Harrier y Bioestimulante Acadian).</span><button class="btn btn-outline btn-small" style="margin-top:8px;" onclick="gImportarInsumos()">⬇️ Cargar ahora</button></div>` : ""}
    <div class="home-actions">
      <button class="btn btn-primary" onclick="gFormTrabajo()">＋ Nuevo trabajo</button>
      <button class="btn btn-outline" onclick="gFormVenta()">🌱 Nueva venta de insumos</button>
      <button class="btn btn-outline" onclick="gFormFactura()">💲 Nueva factura</button>
      <button class="btn btn-outline" onclick="gFormCliente()">👤 Nuevo cliente</button>
    </div>`;
}

async function gEliminarCliente(id){
  const usos = G.trabajos.filter(t=>t.clienteId===id).length + G.facturas.filter(f=>f.clienteId===id).length + G.ventas.filter(v=>v.clienteId===id).length;

  for(const c of G.campos.filter(x=>x.clienteId===id)) await gEscribir(deleteDoc(doc(db,GCOL.campos,c.id)));

async function gGuardarTrabajo(){
  let cliId = gg("gt_cli"); if(!cliId){ showToast("Elegí un cliente"); return; }
  const prev = gEditT ? G.trabajos.find(x=>x.id===gEditT) : null;
  let cliNombre;
  if(cliId==="__nuevo"){
    cliNombre = gg("gt_cliNombre"); if(!cliNombre){ showToast("Escribí el nombre del cliente nuevo"); return; }
    const ref = nuevoId(GCOL.clientes);
    await gEscribir(setDoc(ref,{ nombre:cliNombre, rut:gg("gt_cliRut"), activo:true, createdAt:serverTimestamp(), updatedAt:serverTimestamp() }));
    cliId = ref.id;
  }else cliNombre = gNomCli(cliId);
  let campoId = document.getElementById("gt_campo").value, campoNombre = "";
  if(campoId==="__nuevo"){
    const n = gg("gt_campoNombre");
    if(n){
      const ref = nuevoId(GCOL.campos);
      await gEscribir(setDoc(ref,{ clienteId:cliId, nombre:n, createdAt:serverTimestamp(), updatedAt:serverTimestamp() }));
      campoId = ref.id; campoNombre = n;
    }else campoId = "";
  }else if(campoId) campoNombre = (gCampo(campoId)||{}).nombre || "";
  const d = { clienteId:cliId, campoId, fecha:gg("gt_fecha"), lote:gg("gt_lote"), servicio:gg("gt_serv"), etapa:gg("gt_etapa"),
    operador:gg("gt_oper"), dosis:gg("gt_dosis"), estado:gg("gt_estado"), ha:normNum(gg("gt_ha")), tarifa:normNum(gg("gt_tarifa")),
    moneda:gg("gt_mon")||"USD", importe:normNum(gg("gt_imp")), nota:gg("gt_nota"), updatedAt:serverTimestamp() };
  if(d.estado==="Realizado" && !d.fecha) d.fecha = todayStr();
  const infSel = (document.getElementById("gt_inf")||{}).value || "";
  let borrarInf = null;
  if(infSel && prev && infSel!==prev.informeId){
    d.informeId = infSel;
    const ant = prev.informeId ? STORE.informes.find(i=>i.id===prev.informeId) : null;
    if(ant && !(ant.fotos||[]).length && !ant.enviado && confirm("Vas a quedarte con el informe elegido.\n¿Eliminar el informe anterior de este trabajo (sin fotos)?")) borrarInf = ant.id;
  }
  const id = gEditT; closeForm();
  let tid = id;
  if(id) await gEscribir(updateDoc(doc(db,GCOL.trabajos,id),d));
  else{ const ref = nuevoId(GCOL.trabajos); tid = ref.id; await gEscribir(setDoc(ref,{ ...d, createdAt:serverTimestamp() })); }
  if(d.informeId) await gEscribir(updateDoc(doc(db,"informes",d.informeId),{ trabajoId:tid, updatedAt:serverTimestamp() }));
  if(borrarInf) await gEscribir(deleteDoc(doc(db,"informes",borrarInf)));
  const informeId = await gSincronizarInforme(tid, { ...(prev||{}), ...d }, cliNombre, campoNombre);
  showToast(d.estado==="Realizado" && informeId && !(prev&&prev.informeId) ? "Guardado · informe creado" : (id?"Trabajo actualizado":"Trabajo guardado"));
}

/* Al estar realizado: crea el informe (una sola vez) y mantiene las hectáreas sincronizadas */
async function gSincronizarInforme(tid, t, cliNombre, campoNombre){
  if(t.estado!=="Realizado") return t.informeId || null;
  const existente = t.informeId ? STORE.informes.find(i=>i.id===t.informeId) : null;
  if(existente){
    if(pn(t.ha)>0 && String(existente.supAplicada)!==String(t.ha))
      await gEscribir(updateDoc(doc(db,"informes",existente.id),{ supAplicada:normNum(t.ha), updatedAt:serverTimestamp() }));
    return existente.id;
  }
  const ref = nuevoId("informes");
  await gEscribir(setDoc(ref,{
    fecha:t.fecha||todayStr(), cliente:cliNombre||"", localidad:(gCli(t.clienteId)||{}).localidad||"", campo:campoNombre||"",
    encargado:t.operador||"", equipo:"", cultivo:"", objetivo:"", supAplicada:pn(t.ha)>0?normNum(t.ha):"",
    horaInicio:"", horaFin:"", comentario:"", fotos:[], cFirma:"", establec:"", etapa:t.etapa||"", orden:"",
    dosis:t.dosis||"", operadorAp:t.operador||"", lotes:t.lote?[{ lote:t.lote, has:"" }]:[],
    enviado:false, enviadoFecha:null, borrador:true, trabajoId:tid,
    operador:currentOperadorNombre(), createdAt:serverTimestamp(), updatedAt:serverTimestamp()
  }));
  await gEscribir(updateDoc(doc(db,GCOL.trabajos,tid),{ informeId:ref.id }));
  return ref.id;
}
async function gMarcarRealizado(id){
  const t = G.trabajos.find(x=>x.id===id); if(!t) return;
  const fecha = t.fecha || todayStr();
  await gEscribir(updateDoc(doc(db,GCOL.trabajos,id),{ estado:"Realizado", fecha, updatedAt:serverTimestamp() }));
  const informeId = await gSincronizarInforme(id, { ...t, estado:"Realizado", fecha }, gNomCli(t.clienteId), gNomCampo(t));
  showToast(informeId ? "Realizado · el informe ya está para los operadores" : "Marcado como realizado");
}
async function gEliminarTrabajo(id){
  if(facturaDe(G.trabajos.find(t=>t.id===id)||{id})){ showToast("Está en una factura: sacalo de la factura primero"); return; }

const gProd = id => G.insumos.find(p=>p.id===id);

const FILTROS_V = [["todas","Todas"],["entregar","Por entregar"],["sinfact","Por facturar"],["pago","Pago pendiente"],["cob","Cobradas"]];
function gSetFiltroV(f){ G.filtroV = f; renderGestion(); }
function gStockProd(p){
  const vend = G.ventas.filter(v=>v.productoId===p.id).reduce((n,v)=>n+pn(v.cantidad),0);
  const porEntregar = G.ventas.filter(v=>v.productoId===p.id && !v.entregado).reduce((n,v)=>n+pn(v.cantidad),0);
  return { vend, porEntregar, stock: pn(p.stockInicial)-vend };
}
function gPasaFiltroV(v){
  const f = G.filtroV, ec = estadoCobroV(v);
  if(f==="entregar") return !v.entregado;
  if(f==="sinfact") return ec.k==="sin";
  if(f==="pago") return ec.k==="pend";
  if(f==="cob") return ec.k==="cob";
  return true;
}

/* ---------- Cómo venimos: ganancia de insumos por mes y acumulada ---------- */
const MESES_G = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","setiembre","octubre","noviembre","diciembre"];
const gMesTxt = k => { const [a,m] = k.split("-"); return MESES_G[+m-1].charAt(0).toUpperCase()+MESES_G[+m-1].slice(1)+" "+a; };
function gGananciaHTML(){
  const vs = G.ventas.filter(v=>v.fecha && (v.moneda||"USD")==="USD");
  if(!vs.length) return "";
  const meses = {};
  vs.forEach(v=>{ const k = v.fecha.slice(0,7); const m = meses[k] = meses[k] || { n:0, monto:0, gan:0, lineas:{} };
    m.n++; m.monto += importeVenta(v); m.gan += gananciaVenta(v);
    const l = v.categoria || (gProd(v.productoId)||{}).categoria || "Sin línea"; m.lineas[l] = (m.lineas[l]||0) + gananciaVenta(v); });
  const keys = Object.keys(meses).sort();
  const max = Math.max(...keys.map(k=>meses[k].gan), 1);
  const totG = keys.reduce((n,k)=>n+meses[k].gan,0), totM = keys.reduce((n,k)=>n+meses[k].monto,0);
  let acum = 0; const filas = keys.map(k=>{ acum += meses[k].gan; return { k, ...meses[k], acum }; });
  const prom = totG / keys.length;
  const porLinea = {}; keys.forEach(k=>Object.entries(meses[k].lineas).forEach(([l,g])=>porLinea[l]=(porLinea[l]||0)+g));
  return `
    <div class="section-divider" style="margin-top:0;">Cómo venimos · insumos</div>
    <div class="stats">
      <div class="stat ok"><div class="n" style="font-size:20px;">${esc(money(totG,"USD"))}</div><div class="l">Ganancia acumulada</div><div class="s">${vs.length} venta${vs.length>1?"s":""} · ${totM>0?(totG/totM*100).toFixed(1).replace(".",","):"0"} % de margen</div></div>
      <div class="stat"><div class="n" style="font-size:20px;">${esc(money(prom,"USD"))}</div><div class="l">Promedio por mes</div><div class="s">sobre ${keys.length} mes${keys.length>1?"es":""} con ventas</div></div>
    </div>
    ${[...filas].reverse().map(f=>`<div class="inf-item">
      <div class="hi-top"><div><b>${esc(gMesTxt(f.k))}</b><div class="card-sub">${f.n} venta${f.n>1?"s":""} · vendido ${esc(money(f.monto,"USD"))}</div></div>
        <div style="text-align:right;"><b style="font-size:17px;">${esc(money(f.gan,"USD"))}</b><div class="card-sub">acumulado ${esc(money(f.acum,"USD"))}</div></div></div>
      <div style="height:8px; border-radius:6px; background:#E6EBF2; margin:8px 0 6px; overflow:hidden;"><div style="height:100%; width:${Math.round(f.gan/max*100)}%; background:var(--green); border-radius:6px;"></div></div>
      <div class="hi-summary">${Object.entries(f.lineas).sort((a,b)=>b[1]-a[1]).map(([l,g])=>`<span class="pill nc">${esc(l)} ${esc(money(g,"USD"))}</span>`).join("")}</div>
    </div>`).join("")}
    ${Object.keys(porLinea).length>1 ? `<div class="hint" style="margin:-2px 0 6px;">Total por línea: ${esc(Object.entries(porLinea).sort((a,b)=>b[1]-a[1]).map(([l,g])=>l+" "+money(g,"USD")).join(" · "))}</div>` : ""}`;
}

async function gImportarInsumos(){
  if(!ES_ADMIN) return;
  if(G.insumos.length || G.ventas.length){ showToast("Ya hay insumos cargados"); return; }
  if(!confirm("¿Cargar productos, stock y ventas de la planilla?")) return;
  const pid = {}, cid = {};
  for(const p of G_SEED_INS.productos){
    const ref = nuevoId(GCOL.insumos); pid[p.nombre] = ref.id;
    await gEscribir(setDoc(ref,{ ...p, createdAt:serverTimestamp(), updatedAt:serverTimestamp() }));

  for(const [prod,cli,fecha,cant,precio,gan,ent,plazo] of G_SEED_INS.ventas){

    const p = G_SEED_INS.productos.find(x=>x.nombre===prod);

      cantidad:cant, precio, ganancia:gan, moneda:"USD", plazo, entregado:ent, nota:"", createdAt:serverTimestamp(), updatedAt:serverTimestamp() }));
  }
  showToast("Insumos cargados");
}

}
function gFactCliCambia(){
  const cid = gg("gf_cli"), box = document.getElementById("gf_trabs");
  if(!cid){ box.innerHTML = `<div class="hint">Elegí un cliente para ver sus trabajos realizados sin facturar.</div>`; gFactCalc(); return; }
  const libres = gSorted(G.trabajos.filter(t=>t.clienteId===cid && t.estado==="Realizado" &&
    (!facturaDe(t) || (gEditF && facturaDe(t).id===gEditF))), "fecha");
  const ventasLibres = gSorted(G.ventas.filter(v=>v.clienteId===cid && (!facturaDeV(v) || (gEditF && facturaDeV(v).id===gEditF))), "fecha");
  const htmlV = ventasLibres.map(v=>`
    <label class="g-chk"><input type="checkbox" class="gf_v" value="${v.id}" ${gFactPre.includes(v.id)?"checked":""} onchange="gFactCalc()">
      <span><b>🌱 ${esc(gNomProd(v))}</b> · ${v.fecha?fmtDate(v.fecha):"sin fecha"}<br>
      <small>${esc(fmtNum(v.cantidad))} u. × ${esc(money(v.precio,v.moneda))} = ${esc(money(importeVenta(v),v.moneda))}</small></span></label>`).join("");
  const htmlT = libres.map(t=>`
    <label class="g-chk"><input type="checkbox" class="gf_t" value="${t.id}" ${gFactPre.includes(t.id)?"checked":""} onchange="gFactCalc()">
      <span><b>${esc(gNomCampo(t)||"Sin campo")}</b>${t.lote?" · Lote "+esc(t.lote):""} · ${t.fecha?fmtDate(t.fecha):"sin fecha"}<br>
      <small>${pn(t.ha)>0?esc(fmtNum(t.ha))+" ha":"sin hectáreas"}${pn(t.tarifa)>0?" × "+esc(money(t.tarifa,t.moneda)):""} = ${esc(money(importeTrabajo(t),t.moneda))}</small></span></label>`).join("");
  box.innerHTML = (libres.length || ventasLibres.length) ? htmlT + htmlV : `<div class="hint">Este cliente no tiene trabajos realizados ni ventas sin facturar.</div>`;
  gFactCalc();
}
function gFactSel(){ return [...document.querySelectorAll(".gf_t:checked")].map(x=>G.trabajos.find(t=>t.id===x.value)).filter(Boolean); }
function gFactSelV(){ return [...document.querySelectorAll(".gf_v:checked")].map(x=>G.ventas.find(v=>v.id===x.value)).filter(Boolean); }
function gFactCalc(){
  const ts = gFactSel(), vs = gFactSelV(), el = document.getElementById("gf_tot"); if(!el) return;
  if(!ts.length && !vs.length){ el.textContent = "Tildá los trabajos y ventas que entran en esta factura."; return; }
  el.textContent = [ts.length?ts.length+" trabajo"+(ts.length>1?"s":""):"", vs.length?vs.length+" venta"+(vs.length>1?"s":""):""].filter(Boolean).join(" + ")
    +" · Total calculado: "+monTxt(sumMon([...ts.map(t=>[t.moneda,importeTrabajo(t)]),...vs.map(v=>[v.moneda,importeVenta(v)])],x=>x));
}
async function gGuardarFactura(){
  const clienteId = gg("gf_cli"); if(!clienteId){ showToast("Elegí un cliente"); return; }
  const ts = gFactSel(), vs = gFactSelV(); if(!ts.length && !vs.length){ showToast("Elegí al menos un trabajo o venta"); return; }
  const monedas = [...new Set([...ts.map(t=>t.moneda||"USD"), ...vs.map(v=>v.moneda||"USD")])];
  if(monedas.length>1){ showToast("Hay distinta moneda: facturalos por separado"); return; }
  const totalManual = normNum(gg("gf_total"));
  if(!(pn(totalManual)>0) && ts.reduce((n,t)=>n+importeTrabajo(t),0)+vs.reduce((n,v)=>n+importeVenta(v),0)<=0 && !confirm("Esta factura tiene total $0 (faltan hectáreas o tarifa). ¿Guardar igual?")) return;
  const prev = gEditF ? G.facturas.find(x=>x.id===gEditF) : null, estado = gg("gf_est");
  let vence = gg("gf_vence");
  if(!vence){ const fs = vs.filter(v=>v.fecha && pn(v.plazo)>0).map(v=>{ const x=new Date(v.fecha+"T12:00:00"); x.setDate(x.getDate()+Math.round(pn(v.plazo))); return x.toISOString().slice(0,10); }).sort(); if(fs.length) vence = fs[0]; }
  const d = { clienteId, trabajoIds:ts.map(t=>t.id), ventaIds:vs.map(v=>v.id), numero:gg("gf_num"), moneda:monedas[0], fecha:gg("gf_fecha")||todayStr(), vence,
    estado, cobradaFecha: estado==="cobrada" ? ((prev&&prev.cobradaFecha)||todayStr()) : "", totalManual, nota:gg("gf_nota"), updatedAt:serverTimestamp() };
  const id = gEditF; closeForm();
  if(id) await gEscribir(updateDoc(doc(db,GCOL.facturas,id),d), "Factura actualizada");
  else await gEscribir(setDoc(nuevoId(GCOL.facturas),{ ...d, createdAt:serverTimestamp() }), "Factura guardada");
}
async function gMarcarCobrada(id, valor){
  await gEscribir(updateDoc(doc(db,GCOL.facturas,id),{ estado:valor?"cobrada":"pendiente", cobradaFecha:valor?todayStr():"", updatedAt:serverTimestamp() }),
    valor ? "Marcada como cobrada" : "Vuelve a pendiente de pago");
}
async function gEliminarFactura(id){
  if(!confirm("¿Eliminar esta factura? Sus trabajos y ventas vuelven a “Por facturar”.")) return;
  await gEscribir(deleteDoc(doc(db,GCOL.facturas,id)), "Factura eliminada");
}
